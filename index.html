<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hero Vanguard - Project Hub</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07101d;
      --panel: #0d192b;
      --panel-2: #101f35;
      --line: #263b58;
      --text: #edf5ff;
      --muted: #9bb0ca;
      --accent: #e5b64d;
      --accent-soft: rgba(229,182,77,.15);
      --good: #75d39b;
      --danger: #ed7486;
      --shadow: 0 18px 55px rgba(0,0,0,.3);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 74% -10%, rgba(80,127,194,.17), transparent 34rem),
        linear-gradient(160deg, #07101d 0%, #091525 55%, #07101d 100%);
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }
    button, a { font: inherit; }
    button { color: inherit; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 22px;
      min-height: 78px;
      padding: 12px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(7,16,29,.93);
      backdrop-filter: blur(18px);
    }
    .brand { min-width: 260px; }
    .brand small {
      display: block;
      color: var(--accent);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .17em;
      text-transform: uppercase;
    }
    .brand strong { display: block; margin-top: 4px; font-size: 19px; }
    .modes {
      display: flex;
      flex: 1;
      justify-content: center;
      gap: 8px;
    }
    .mode-btn, .act-btn, .stage-btn, .soft-btn {
      cursor: pointer;
      border: 1px solid var(--line);
      transition: .18s ease;
    }
    .mode-btn {
      padding: 11px 18px;
      border-radius: 10px;
      background: #0d192b;
      color: var(--muted);
      font-weight: 800;
    }
    .mode-btn:hover, .mode-btn.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--text);
    }
    .context-pill {
      min-width: 245px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #0a1525;
      text-align: right;
    }
    .context-pill span { display: block; color: var(--muted); font-size: 11px; }
    .context-pill b { display: block; margin-top: 2px; color: var(--accent); font-size: 13px; }
    .workspace {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      min-height: calc(100vh - 79px);
    }
    .sidebar {
      position: sticky;
      top: 79px;
      height: calc(100vh - 79px);
      overflow: auto;
      padding: 20px 16px 32px;
      border-right: 1px solid var(--line);
      background: rgba(8,18,32,.76);
    }
    .side-title {
      display: flex;
      align-items: end;
      justify-content: space-between;
      padding: 0 5px 10px;
    }
    .side-title span { color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .side-title b { color: var(--accent); font-size: 11px; }
    .act-list, .stage-list { display: grid; gap: 7px; }
    .act-btn {
      display: grid;
      grid-template-columns: 45px 1fr auto;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 7px 9px;
      border-radius: 12px;
      background: #0b1728;
      text-align: left;
    }
    .act-btn img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      filter: drop-shadow(0 5px 8px rgba(0,0,0,.35));
    }
    .act-btn span { display: block; color: var(--muted); font-size: 10px; font-weight: 800; }
    .act-btn strong { display: block; margin-top: 2px; font-size: 12px; line-height: 1.25; }
    .act-btn em {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--region);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--region) 18%, transparent);
    }
    .act-btn:hover, .act-btn.active {
      transform: translateX(2px);
      border-color: var(--region);
      background: color-mix(in srgb, var(--region) 12%, #0b1728);
    }
    .stage-heading {
      margin: 22px 5px 9px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .stage-btn {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 8px;
      width: 100%;
      padding: 10px;
      border-radius: 9px;
      background: transparent;
      text-align: left;
    }
    .stage-btn i {
      display: grid;
      place-items: center;
      width: 25px;
      height: 25px;
      border-radius: 7px;
      background: #152942;
      color: var(--muted);
      font-size: 11px;
      font-style: normal;
      font-weight: 900;
    }
    .stage-btn b { display: block; font-size: 12px; line-height: 1.3; }
    .stage-btn span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .stage-btn:hover, .stage-btn.active { border-color: var(--accent); background: var(--accent-soft); }
    .stage-btn.active i { background: var(--accent); color: #08111e; }
    .main { min-width: 0; padding: 28px; }
    .view { max-width: 1260px; margin: 0 auto; }
    .eyebrow {
      color: var(--accent);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1 { max-width: 900px; margin: 8px 0 9px; font-size: clamp(28px, 4vw, 48px); line-height: 1.05; letter-spacing: -.035em; }
    .lead { max-width: 930px; color: var(--muted); line-height: 1.65; }
    .stage-hero, .map-toolbar, .card, .scene, .quest-card {
      border: 1px solid var(--line);
      background: linear-gradient(150deg, rgba(17,33,56,.96), rgba(10,22,38,.96));
      box-shadow: var(--shadow);
    }
    .stage-hero {
      position: relative;
      overflow: hidden;
      padding: 26px;
      border-radius: 18px;
    }
    .stage-hero::after {
      content: "";
      position: absolute;
      right: -70px;
      top: -85px;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: var(--accent);
      opacity: .09;
      filter: blur(3px);
    }
    .hero-meta, .chips, .section-head, .quest-head, .scene-head, .map-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
    }
    .hero-meta { margin-top: 18px; }
    .chip {
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #0b1728;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
    }
    .chip.accent { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; margin-top: 14px; }
    .card { padding: 19px; border-radius: 14px; box-shadow: none; }
    .card h2, .section-head h2 { margin-bottom: 8px; font-size: 17px; }
    .card p { margin: 0; color: var(--muted); line-height: 1.62; }
    .card strong { color: var(--text); }
    .section-head { justify-content: space-between; margin: 31px 0 13px; }
    .section-head div > span { display: block; margin-bottom: 5px; color: var(--accent); font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: .12em; }
    .section-head h2 { margin: 0; font-size: 23px; }
    .section-head p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .timeline { position: relative; display: grid; gap: 14px; }
    .scene { position: relative; padding: 20px; border-radius: 15px; box-shadow: none; }
    .scene-head { justify-content: space-between; }
    .scene-time { color: var(--accent); font-size: 11px; font-weight: 900; text-transform: uppercase; }
    .scene h3 { margin: 7px 0 5px; font-size: 18px; }
    .scene-purpose { color: var(--muted); font-size: 12px; line-height: 1.5; }
    details {
      margin-top: 14px;
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }
    summary { cursor: pointer; color: var(--accent); font-size: 12px; font-weight: 800; }
    .dialogue { display: grid; gap: 8px; margin-top: 12px; }
    .line {
      display: grid;
      grid-template-columns: minmax(85px, 135px) 1fr;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 9px;
      background: rgba(5,13,24,.65);
    }
    .line b { color: var(--accent); font-size: 12px; }
    .line p { margin: 0; color: #dce9f8; font-size: 13px; line-height: 1.55; }
    .beat-grid { display: grid; gap: 14px; }
    .beat {
      display: grid;
      grid-template-columns: 94px minmax(0,1fr);
      gap: 16px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: linear-gradient(150deg, rgba(17,33,56,.96), rgba(10,22,38,.96));
    }
    .beat-day {
      display: grid;
      place-items: center;
      align-self: start;
      min-height: 76px;
      padding: 10px;
      border: 1px solid var(--accent);
      border-radius: 12px;
      background: var(--accent-soft);
      color: var(--accent);
      text-align: center;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }
    .beat h3 { margin: 5px 0 6px; font-size: 19px; }
    .beat-note { margin: 0 0 13px; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .choice-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 9px; margin-top: 12px; }
    .choice {
      padding: 10px 11px;
      border: 1px solid #3a5472;
      border-radius: 9px;
      background: rgba(7,17,30,.65);
    }
    .choice b { display: block; color: var(--accent); font-size: 12px; }
    .choice span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .mentor {
      position: relative;
      display: grid;
      grid-template-columns: minmax(230px, .58fr) minmax(0, 1.42fr);
      overflow: hidden;
      margin-top: 14px;
      border: 1px solid color-mix(in srgb, var(--accent) 65%, var(--line));
      border-radius: 17px;
      background: linear-gradient(135deg, rgba(229,182,77,.13), rgba(12,27,47,.96) 55%);
    }
    .mentor-visual {
      position: relative;
      min-height: 380px;
      background: radial-gradient(circle at 50% 35%, rgba(229,182,77,.24), transparent 54%);
    }
    .mentor-visual img { position: absolute; inset: 8px 0 0; width: 100%; height: calc(100% - 8px); object-fit: contain; object-position: center bottom; }
    .mentor-body { padding: 24px 24px 24px 0; }
    .mentor-body h2 { margin: 5px 0 5px; font-size: 28px; }
    .mentor-body > p { color: var(--muted); font-size: 12px; line-height: 1.6; }
    .tutorial-list { display: grid; gap: 8px; margin-top: 15px; }
    .tutorial-step {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 9px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(5,14,25,.55);
    }
    .tutorial-step i {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: var(--accent);
      color: #08111e;
      font-size: 11px;
      font-style: normal;
      font-weight: 900;
    }
    .tutorial-step b { display: block; font-size: 12px; }
    .tutorial-step span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .quest-layout { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(300px, .75fr); gap: 16px; margin-top: 18px; }
    .quest-card { padding: 21px; border-radius: 16px; box-shadow: none; }
    .quest-card.main-quest { border-color: color-mix(in srgb, var(--accent) 65%, var(--line)); }
    .quest-head { justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 13px; margin-bottom: 13px; }
    .quest-head span { color: var(--accent); font-size: 10px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
    .quest-head h2 { margin: 4px 0 0; font-size: 20px; }
    .quest-giver { color: var(--muted); font-size: 11px; }
    .quest-summary { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .objective-list { display: grid; gap: 10px; margin-top: 17px; }
    .objective {
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgba(6,15,27,.54);
    }
    .objective-num {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--accent);
      color: #08111e;
      font-size: 11px;
      font-weight: 900;
    }
    .objective h3 { margin: 0 0 5px; font-size: 13px; }
    .objective p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .objective .condition { margin-top: 7px; color: #d8e7f6; }
    .side-stack { display: grid; gap: 14px; }
    .side-stack .quest-card { border-left: 3px solid var(--good); }
    .mini-title { margin: 17px 0 8px; color: var(--accent); font-size: 11px; font-weight: 900; text-transform: uppercase; }
    .condition-list, .reward-list { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
    .condition-list li, .reward-list li {
      position: relative;
      padding-left: 17px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .condition-list li::before, .reward-list li::before {
      content: "";
      position: absolute;
      left: 1px;
      top: .52em;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--good);
    }
    .availability { padding: 10px 11px; border-radius: 9px; background: rgba(117,211,155,.08); color: #ccebd9; font-size: 11px; line-height: 1.55; }
    .payoff { margin-top: 12px; padding: 11px; border: 1px dashed #45617e; border-radius: 9px; color: #c8d8e9; font-size: 11px; line-height: 1.55; }
    .map-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 20px;
      border-radius: 15px 15px 0 0;
      box-shadow: none;
    }
    .map-toolbar h1 { margin: 4px 0 3px; font-size: 25px; }
    .map-toolbar p { margin: 0; color: var(--muted); font-size: 12px; }
    .soft-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 12px;
      border-radius: 9px;
      background: #0b1728;
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
    }
    .soft-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
    .atlas-frame {
      display: block;
      width: 100%;
      height: calc(100vh - 190px);
      min-height: 720px;
      border: 1px solid var(--line);
      border-top: 0;
      border-radius: 0 0 15px 15px;
      background: #07101d;
    }
    .entity-link {
      display: inline;
      padding: 0;
      border: 0;
      border-bottom: 1px dotted var(--accent);
      background: transparent;
      color: var(--accent);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    .entity-link:hover { color: var(--text); border-bottom-style: solid; }
    .library-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin: 16px 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(10,22,38,.8);
    }
    .library-tabs { display: flex; gap: 7px; }
    .library-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; }
    .entity-card {
      scroll-margin-top: 105px;
      display: grid;
      grid-template-columns: 170px minmax(0,1fr);
      overflow: hidden;
      min-height: 260px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: linear-gradient(150deg, rgba(17,33,56,.96), rgba(10,22,38,.96));
    }
    .entity-card.focused { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
    .entity-visual {
      display: grid;
      place-items: start center;
      min-height: 240px;
      padding: 12px;
      border-right: 1px solid var(--line);
      background: radial-gradient(circle at 50% 42%, var(--accent-soft), rgba(6,15,27,.88) 70%);
    }
    .entity-visual img { width: 100%; height: 100%; max-height: 260px; object-fit: contain; filter: drop-shadow(0 12px 11px rgba(0,0,0,.45)); }
    .entity-initials {
      display: grid;
      place-items: center;
      width: 105px;
      height: 105px;
      border: 1px solid var(--accent);
      border-radius: 50%;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 31px;
      font-weight: 900;
    }
    .entity-body { min-width: 0; padding: 17px; }
    .entity-body h2 { margin: 5px 0 4px; font-size: 21px; }
    .entity-body p { margin: 8px 0; color: var(--muted); font-size: 11px; line-height: 1.58; }
    .entity-body p strong { color: var(--text); }
    .appearance-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .appearance-list button { padding: 5px 7px; border: 1px solid var(--line); border-radius: 7px; background: #0b1728; color: var(--muted); font-size: 10px; cursor: pointer; }
    .appearance-list button:hover { border-color: var(--accent); color: var(--text); }
    .empty { padding: 60px; text-align: center; color: var(--muted); }
    @media (max-width: 1050px) {
      .topbar { flex-wrap: wrap; gap: 10px; }
      .brand { min-width: 210px; }
      .context-pill { display: none; }
      .modes { justify-content: flex-end; }
      .workspace { grid-template-columns: 245px minmax(0,1fr); }
      .quest-layout { grid-template-columns: 1fr; }
      .library-grid { grid-template-columns: 1fr; }
      .main { padding: 20px; }
    }
    @media (max-width: 760px) {
      .topbar { position: relative; padding: 12px; }
      .brand { width: 100%; }
      .modes { width: 100%; justify-content: stretch; }
      .mode-btn { flex: 1; padding: 9px 5px; font-size: 11px; }
      .workspace { display: block; }
      .sidebar { position: relative; top: 0; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .act-list { grid-template-columns: repeat(3, minmax(0,1fr)); }
      .act-btn { display: block; text-align: center; }
      .act-btn img { width: 36px; height: 36px; }
      .act-btn em, .act-btn span { display: none; }
      .stage-list { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .main { padding: 14px; }
      .grid-2 { grid-template-columns: 1fr; }
      .line { grid-template-columns: 1fr; gap: 4px; }
      .beat { grid-template-columns: 1fr; }
      .beat-day { min-height: auto; }
      .choice-grid { grid-template-columns: 1fr; }
      .mentor { grid-template-columns: 1fr; }
      .mentor-visual { min-height: 320px; }
      .mentor-body { padding: 20px; }
      .entity-card { grid-template-columns: 1fr; }
      .entity-visual { min-height: 230px; border-right: 0; border-bottom: 1px solid var(--line); }
      .map-toolbar { align-items: flex-start; flex-direction: column; }
      .atlas-frame { min-height: 650px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <small>Hero Vanguard · Project Hub</small>
      <strong>Thế giới, truyện và nhiệm vụ</strong>
    </div>
    <nav class="modes" aria-label="Chế độ xem">
      <button class="mode-btn" data-mode="map">Thế giới &amp; Map</button>
      <button class="mode-btn" data-mode="story">Tuyến truyện</button>
      <button class="mode-btn" data-mode="quest">Nhiệm vụ</button>
      <button class="mode-btn" data-mode="codex">Nhân vật &amp; Quái vật</button>
    </nav>
    <div class="context-pill"><span>Đang xem cùng ngữ cảnh</span><b id="contextText"></b></div>
  </header>
  <div class="workspace">
    <aside class="sidebar">
      <div class="side-title"><span>Chọn khu vực / Hồi</span><b id="actProgress"></b></div>
      <div class="act-list" id="actList"></div>
      <div class="stage-heading">Chọn màn trong Hồi</div>
      <div class="stage-list" id="stageList"></div>
    </aside>
    <main class="main" id="main"></main>
  </div>
  <script>
    const STORY = {"schema_version":1,"title":"Hero Vanguard: RPG - Kịch Bản Cốt Truyện Và Hội Thoại Chi Tiết","canon_source":"Bản sao của BaoCaoCCG1.docx.pdf","setting":"Lục địa Ionie, Vương Quốc Peace, năm 1024 KN","premise":"Mici nhận nhiệm vụ Thảo Phạt Ma Vương cấp SSS để kiếm tiền mở quán ăn. Qua hành trình, anh trở thành thủ lĩnh thực sự và cùng Tarot, Frieran, Elaine đánh bại Đại Ma Vương Vuu.","delivery_standard":{"format":"Phiêu lưu chữ theo ngày, lựa chọn sự kiện và chiến đấu tự động","main_story_per_stage":"Ba hộp sự kiện cốt truyện ngắn: mở mục tiêu, bước ngoặt và dẫn vào boss.","dialogue_budget":"Mỗi hộp hiển thị khoảng 4 lượt thoại, đọc trong 8-15 giây.","choices":"Mỗi sự kiện có hai lựa chọn cho lợi ích khác nhau trong lượt chơi, nhưng cùng hội tụ về tuyến truyện canon.","detailed_dialogue":"Bản thoại đầy đủ được giữ cho báo cáo, Arrow và các cutscene quan trọng; không tự động phát toàn bộ trong lượt chơi."},"cast":[{"name":"Mici","gender":"Nam","voice":"Tích cực, thực tế, nói thẳng, hay liên hệ tới công việc và quán ăn; càng về cuối càng thể hiện trách nhiệm của thủ lĩnh."},{"name":"Mira","gender":"Nữ","voice":"Ấm áp nhưng nghiêm khi hướng dẫn; là cựu mạo hiểm giả và chủ quán ở Breeze, đóng vai trò người dạy chiến đấu đầu game cho Mici."},{"name":"Tarot","gender":"Nam","voice":"Phân tích, bình tĩnh, thường chỉ ra rủi ro; lời nói khô nhưng quan tâm đồng đội qua hành động."},{"name":"Frieran","gender":"Nữ","voice":"Điềm tĩnh, ngắn gọn, có góc nhìn hàng trăm năm; ban đầu quan sát, về sau chủ động bảo vệ đồng đội."},{"name":"Elaine","gender":"Vô tính","voice":"Nhẹ nhàng, chân thành, nhìn mọi vấn đề qua sự sống và thiên nhiên; không ngây thơ trước nguy hiểm."},{"name":"Vuu","gender":"Không xác định","voice":"Uy quyền, kiêu ngạo, xem bản thân là hiện thân của chu kỳ và dùng nỗi sợ của đối thủ để tấn công."}],"acts":[{"number":0,"name":"Ngoại Ô Làng Gió Nhẹ","role":"Mở đầu hành trình","boss":"Râu Đỏ","stages":[{"id":"h0_m01","act":0,"stage":1,"title":"Nguồn Lương Thực Bị Cắt Đứt","days":20,"summary":"Mici nhận nhiệm vụ đầu tiên từ Trưởng làng Breeze: tìm đoàn xe lương thực mất tích và đánh bại sơn tặc Râu Đỏ.","objective":"Khôi phục tuyến lương thực, bảo vệ dân làng và chứng minh Mici đủ khả năng trở thành mạo hiểm giả.","enemies":["Chuột đồng khổng lồ","Sói rừng","Sơn tặc"],"boss":"Thủ lĩnh Sơn Tặc Râu Đỏ","relationship":"Mici từ một thanh niên muốn kiếm tiền trở thành người được làng Breeze tin tưởng.","scenes":[{"name":"Bữa sáng thiếu bánh mì","timing":"Ngày 1","purpose":"Thiết lập động cơ và trách nhiệm của Mici","lines":[{"speaker":"Trưởng làng","text":"Mici, kho lương chỉ còn đủ dùng ba ngày. Đoàn xe từ Peace đã mất tích từ tối qua."},{"speaker":"Mici","text":"Ba ngày à? Vậy tiền công phải đủ để tôi mua bữa tối trong ngày thứ tư."},{"speaker":"Trưởng làng","text":"Ta biết cháu muốn kiếm tiền mở quán ăn. Nhưng lần này mọi căn bếp trong làng đều trông vào cháu."},{"speaker":"Mici","text":"Cháu nói đùa để đỡ căng thẳng thôi. Cháu sẽ đưa lương thực về, cả người đánh xe nữa."},{"speaker":"Trưởng làng","text":"Đừng cố làm anh hùng một mình."},{"speaker":"Mici","text":"Cháu không định làm anh hùng. Cháu chỉ định hoàn thành công việc."}]},{"name":"Dấu bánh xe trong rừng","timing":"Giữa màn","purpose":"Cho thấy Mici suy luận và quan tâm tới người gặp nạn","lines":[{"speaker":"Mici","text":"Bánh xe bị kéo khỏi đường chính. Sơn tặc muốn chúng ta nghĩ đoàn xe bị thú rừng tấn công."},{"speaker":"Người đánh xe bị thương","text":"Cậu... đừng đuổi theo. Râu Đỏ khỏe hơn bất kỳ ai trong làng."},{"speaker":"Mici","text":"Ông còn nhớ chúng đi hướng nào không?"},{"speaker":"Người đánh xe bị thương","text":"Về phía đồi đá. Chúng mang hết lương thực, nhưng không giết chúng tôi."},{"speaker":"Mici","text":"Vậy chúng cần hàng hóa hơn là mạng người. Tôi vẫn còn cơ hội nói chuyện trước khi dùng kiếm."},{"speaker":"Người đánh xe bị thương","text":"Cậu vẫn định đi sao?"},{"speaker":"Mici","text":"Tôi đã hứa đưa cả lương thực lẫn người đánh chỉ ra lệnh.","story_limit":"Mira chỉ hướng dẫn và hỗ trợ từ Breeze; cô không gia nhập tổ đội nên không lấn tuyến của Tarot, Frieran và Elaine.","introduction":"Trước khi Mici lên đường tìm đoàn xe lương thực, Mira buộc cậu chứng minh mình vẫn nhớ cách chiến đấu an toàn.","tutorial_sequence":[{"step":1,"mechanic":"Đọc sức mạnh tổng hợp của tổ đội","objective":"Quan sát ba chỉ số HP, Công và Phòng Thủ trước khi bắt đầu trận tập.","dialogue":[{"speaker":"Mira","text":"Trong hành trình dài, cháu không thể ra lệnh cho từng nhát kiếm. Hãy nhìn sức mạnh chung của cả đội trước khi bước vào trận."},{"speaker":"Mici","text":"HP để biết đi được bao xa, Công để kết thúc trận, Phòng Thủ để không phải nằm lại giữa đường."},{"speaker":"Mira","text":"Đúng. Ba con số đơn giản, nhưng chọn sai hướng phát triển thì boss sẽ dạy lại bằng cách đau hơn."}]},{"step":2,"mechanic":"Quan sát chiến đấu tự động","objective":"Bắt đầu trận tập và theo dõi cách Mici tự động giao chiến dựa trên chỉ số hiện tại.","dialogue":[{"speaker":"Mira","text":"Khi trận đấu bắt đầu, cháu tập trung chiến đấu. Người dẫn đường cần nhìn xem đội hình đang thiếu sức bền hay thiếu sát thương."},{"speaker":"Mici","text":"Tức là để tay cháu lo thanh kiếm, còn người chơi lo chúng ta có đủ mạnh để thắng."}]},{"step":3,"mechanic":"Nhận EXP và chọn nâng cấp","objective":"Sau trận tập, chọn một trong ba nâng cấp ngẫu nhiên cho chỉ số chung của tổ đội.","dialogue":[{"speaker":"Mira","text":"Mỗi lần mạnh lên, cháu chỉ được chọn một hướng. Thêm HP để đi xa, thêm Công để thắng nhanh, hoặc thêm Phòng Thủ để bớt tổn thất."},{"speaker":"Mici","text":"Giống chọn món cho thực đơn. Không thể nhét mọi thứ vào cùng một nồi."}]},{"step":4,"mechanic":"Trang bị và xây dựng đội hình","objective":"Trang bị vũ khí, giáp hoặc phụ kiện rồi so sánh thay đổi trên chỉ số tổng hợp.","dialogue":[{"speaker":"Mira","text":"Trang bị tốt không chỉ làm một người mạnh hơn. Nó phải bù đúng phần cả đội đang thiếu."},{"speaker":"Mici","text":"Vậy chiếc giáp ","purpose":"Đặt nền cho lý do hợp tác","lines":[{"speaker":"Tarot","text":"Cậu nhận nhiệm vụ mà không hỏi số lượng kẻ địch, đường rút hay tỷ lệ thương vong?"},{"speaker":"Mici","text":"Tôi hỏi tiền thưởng."},{"speaker":"Tarot","text":"Đó không phải thứ tôi vừa liệt kê."},{"speaker":"Mici","text":"Nhưng nó trả cho băng bó, thức ăn và một mái nhà sau này."},{"speaker":"Tarot","text":"Cậu cũng muốn một mái nhà?"},{"speaker":"Mici","text":"Một quán ăn. Còn anh?"},{"speaker":"Tarot","text":"Một nơi đủ chắc để không ai có thể ra lệnh tôi phải rời đi."},{"speaker":"Mici","text":"Vậy chúng ta có thể cùng kiếm tiền cho hai giấc mơ khác nhau."}]},{"name":"Lá bài mở đường","timing":"Ngày cuối","purpose":"Tarot lựa chọn hợp tác với Mici","lines":[{"speaker":"Đội trưởng Goblin","text":"Người đường lớn phải nộp hàng! Luật của Vua Goblin!"},{"speaker":"Tarot","text":"Chúng chia đội hình ba lớp. Tôi sẽ dùng The Chariot phá tuyến giữa."},{"speaker":"Mici","text":"Còn tôi?"},{"speaker":"Tarot","text":"Cậu làm điều cậu giỏi nhất: khiến tất cả nhìn về phía cậu."},{"speaker":"Mici","text":"Cuối cùng anh cũng hiểu phong cách của tôi."},{"speaker":"Tarot","text":"Tôi hiểu nó nguy hiểm. Nhưng lần này nguy hiểm có ích."},{"speaker":"Mici","text":"Sau trận này, anh đi cùng tôi chứ?"},{"speaker":"Tarot","text":"Nếu tiền thưởng được chia rõ ràng và cậu chịu nghe kế hoạch."},{"speaker":"Mici","text":"Tôi đồng ý một nửa."},{"speaker":"Tarot","text":"Tôi đoán đó là phần nghe kế hoạch."}]}],"adventure_delivery":[{"day":1,"role":"Mở mục tiêu","event_type":"Sự kiện cốt truyện","title":"Một người, hai kế hoạch","purpose":"Giới thiệu sự đối lập giữa Mici và Tarot","presentation":"Hộp sự kiện ngắn, khoảng 8-15 giây; người chơi có thể chạm nhanh để đọc tiếp.","compact_lines":[{"speaker":"Chủ thương đoàn","text":"Cứu chúng tôi! Goblin đang bao vây cối xay!"},{"speaker":"Mici","text":"Mọi người lùi vào trong. Tôi sẽ mở đường phía trước."},{"speaker":"Tarot","text":"Đơn giản đến mức đáng ngờ."},{"speaker"  vây."},{"speaker":"Frieran","text":"Tôi biết. Chúng đã đứng đó mười bảy phút."},{"speaker":"Tarot","text":"Và cô vẫn tiếp tục đọc?"},{"speaker":"Frieran","text":"Chương này sắp hết. Tôi không muốn dừng giữa đoạn."},{"speaker":"Mici","text":"Chúng tôi có thể giúp cô có thời gian đọc chương sau."},{"speaker":"Frieran","text":"Được. Con đầu đàn phản chiếu ma thuật, nên đừng dùng đòn sáng trực diện."},{"speaker":"Tarot","text":"Cô quan sát kỹ hơn vẻ ngoài cho thấy."},{"speaker":"Frieran","text":"Tôi có mười bảy phút để quan sát."}]},{"name":"Dấu tích của chu kỳ cũ","timing":"Giữa màn","purpose":"Gắn Frieran với lore chu kỳ Ma Vương","lines":[{"speaker":"Frieran","text":"Những ký hiệu này xuất hiện trong lần Ma Vương thức tỉnh ba trăm năm trước."},{"speaker":"Mici","text":"Cô đã đọc về chúng?"},{"speaker":"Frieran","text":"Tôi đã nhìn thấy chúng khi còn mới."},{"speaker":"Tarot","text":"Cô bao nhiêu tuổi?"},{"speaker":"Frieran","text":"Đủ lớn để biết câu hỏi đó thường khiến người hỏi thất vọng."},{"speaker":"Mici","text":"Vậy cô biết điều gì đang đánh thức quái vật?"},{"speaker":"Frieran","text":"Tà khí đang lan sớm hơn các chu kỳ trước. Tôi muốn biết vì sao."},{"speaker":"Tarot","text":"Chúng tôi đang đi cùng hướng. Có vẻ ba người sẽ an toàn hơn hai."}]},{"name":"Lời mời đồng hành","timing":"Ngày cuối","purpose":"Đưa Frieran vào tổ đội","lines":[{"speaker":"Frieran","text":"Con đầu đàn đang bảo vệ lối vào tàn tích, không phải săn chúng ta."},{"speaker":"Mici","text":"Nghĩa là phía sau có thứ làm nó sợ hơn chúng ta."},{"speaker":"Tarot","text":"Một nhận xét không hề dễ chịu."},{"speaker":"Frieran","text":"Nếu đánh đúng các tinh thể trên chân, chúng ta có thể ngăn nó di chuyển mà không phá lớp giáp."},{"speaker":"Mici","text":"Cô chỉ đường, Tarot tính thời điểm, tôi giữ sự chú ý của nó."},{"speaker":"Tarot","text":"Đó đang trở thành chiến thuật quen thuộc."},{"speaker":"Frieran","text":"Hiệu quả là đủ. Sau trận, tôi sẽ đi cùng hai người tới mỏ sâu."},{"speaker":"Mici","t  quan tâm tới con đường của mình.","scenes":[{"name":"Giọng nói từ tán lá","timing":"Ngày 1","purpose":"Giới thiệu Elaine và xung đột giá trị","lines":[{"speaker":"Elaine","text":"Dừng lại. Mỗi bước chân của các người làm rễ cây đau thêm."},{"speaker":"Mici","text":"Chúng tôi không muốn làm hại khu rừng. Chúng tôi cần đi qua."},{"speaker":"Elaine","text":"Ai cũng nói mình chỉ đi qua. Sau đó họ để lại cây gãy và lửa tắt dở."},{"speaker":"Tarot","text":"Chúng tôi có thể chứng minh bằng hành động. Cô cần gì?"},{"speaker":"Elaine","text":"Cây non phía trước đang bị bầy sói vây. Hãy cứu nó mà không giết những con sói."},{"speaker":"Mici","text":"Chúng đang tấn công chúng tôi."},{"speaker":"Frieran","text":"Vì tà khí làm chúng đau. Thanh lọc sẽ khó hơn chiến đấu."},{"speaker":"Mici","text":"Được. Chúng ta làm theo cách khó hơn."}]},{"name":"Cây non được cứu","timing":"Giữa màn","purpose":"Elaine bắt đầu thay đổi cách nhìn","lines":[{"speaker":"Elaine","text":"Anh đã dùng lưng che cho cây khi con gấu lao tới."},{"speaker":"Mici","text":"Đại kiếm quá gần rễ. Tôi không muốn chém nhầm."},{"speaker":"Elaine","text":"Con người thường không chú ý thứ nhỏ hơn mình."},{"speaker":"Tarot","text":"Mici chú ý tới mọi thứ có thể trở thành nguyên liệu nấu ăn hoặc cần được bảo vệ."},{"speaker":"Mici","text":"Anh có thể bỏ phần đầu không?"},{"speaker":"Frieran","text":"Nhưng nó khá chính xác."},{"speaker":"Elaine","text":"Các người thật kỳ lạ."},{"speaker":"Mici","text":"Tôi hy vọng đó là một bước tiến so với nguy hiểm."}]},{"name":"Gấu rừng tha hóa","timing":"Ngày cuối","purpose":"Đặt nền cho Elaine hợp tác","lines":[{"speaker":"Elaine","text":"Con gấu không kiểm soát được mình. Đừng làm nó bị thương thêm."},{"speaker":"Mici","text":"Tarot, giữ chân. Frieran, thanh lọc. Tôi sẽ chặn móng vuốt."},{"speaker":"Tarot","text":"Cậu không thể đỡ mãi."},{"speaker":"Mici","text":"Tôi chỉ cần đỡ tới khi hai người xong."},{"speaker":"Frieran","text":"Elaine, cô có thể dẫn tà khí ra khỏi tim nó không  thường chúng tránh xa làng và săn thú nhỏ, nhưng việc thức ăn bị cắt đứt cùng sự lan rộng của tà khí khiến đàn sói tiến gần đường vận chuyển. Trước khi xuất hiện, người chơi có thể thấy dấu chân, lông mắc trên bụi hoặc nghe tiếng hú.","gameplay":"Đối thủ chiến đấu tự động thông thường; cung cấp EXP để tăng cấp và chọn nâng cấp HP, Công hoặc Phòng Thủ.","is_boss":false,"aliases":["Sói đồng cỏ","Sói đồng cỏ"]},{"id":"mob-0-02","kind":"mob","name":"Chuột đồng trộm lương","act":0,"region":"Ngoại Ô Breeze","role":"Sinh vật đồng ruộng","image":"world-atlas-assets/mobs/0/0-02.png","description":"Loài chuột thông minh sống quanh kho, ruộng và xe hàng. Chúng thu gom hạt giống vào túi nhỏ, thường chỉ gây phiền phức nhưng trở nên hung hăng khi nguồn thức ăn bị xáo trộn. Trong hệ sinh thái, chúng là thức ăn của sói và giúp phát tán hạt cây.","gameplay":"Đối thủ chiến đấu tự động thông thường; cung cấp EXP để tăng cấp và chọn nâng cấp HP, Công hoặc Phòng Thủ.","is_boss":false,"aliases":["Chuột đồng khổng lồ","Chuột đồng trộm lương"]},{"id":"mob-0-03","kind":"mob","name":"Sơn tặc đường rừng","act":0,"region":"Ngoại Ô Breeze","role":"Đơn vị cận chiến","image":"world-atlas-assets/mobs/0/0-03.png","description":"Những người sống ngoài phạm vi bảo hộ của Peace, mặc đồ da cũ và dùng vũ khí dễ sửa chữa. Không phải tất cả đều thích cướp bóc; nhiều người tham gia vì gia đình bị cắt cứu trợ. Họ đặt bẫy trên đường, đánh nhanh rồi rút vào rừng.","gameplay":"Đối thủ chiến đấu tự động thông thường; cung cấp EXP để tăng cấp và chọn nâng cấp HP, Công hoặc Phòng Thủ.","is_boss":false,"aliases":["Sơn tặc","Sơn tặc đường rừng"]},{"id":"mob-0-04","kind":"mob","name":"Thủ lĩnh Râu Đỏ","act":0,"region":"Ngoại Ô Breeze","role":"Boss khu vực","image":"world-atlas-assets/mobs/0/0-04.png","description":"Một cựu hộ vệ đoàn xe có vóc người thấp nhưng chắc khỏe, râu đỏ nổi bật và trang bị được ghép từ nhiều chuyến hàng. Râu Đỏ hiểu rõ tuyến đường và cách vận hành của Công Hội. Hắn là Boss mang tính xã hội đầu tiên: nguy hiểm, phạm tội nhưng có động cơ mà người chơi có thể hiểu.","gameplay":"Trận kiểm tra toàn bộ hướng xây dựng đội: HP để sống sót, Công để kết thúc trước khi bị bào mòn và Phòng Thủ để giảm áp lực.","is_boss":true,"aliases":["Thủ lĩnh Sơn Tặc Râu Đỏ","Thủ lĩnh Râu Đỏ"]},{"id":"mob-1-01","kind":"mob","name":"Goblin do thám","act":1,"region":"Thảo Nguyên Gió Hát","role":"Trinh sát","image":"world-atlas-assets/mobs/1/1-01.png","description":"Goblin nhỏ, nhanh, mặc đồ ngụy trang bằng cỏ và mang dao ngắn. Chúng quan sát đoàn xe, đánh dấu hàng hóa và chỉ tấn công khi tin rằng trại đang bị đe dọa. Nếu được giúp đỡ, chúng có thể trở thành nguồn tin về đường đi.","gameplay":"Tạo áp lực sớm lên đội hình; Phòng Thủ và HP giúp tổ đội ổn định trước khi tự động phản công.","is_boss":false,"aliases":["Goblin trinh sát","Goblin trinh sát"]},{"id":"mob-1-02","kind":"mob","name":"Pháp sư gió Goblin","act":1,"region":"Thảo Nguyên Gió Hát","role":"Pháp sư hỗ trợ","image":"world-atlas-assets/mobs/1/1-02.png","description":"Các pháp sư gìn giữ cột gió và dùng tinh thể nhỏ để điều hướng luồng khí. Áo choàng vá và nhiều túi thuốc cho thấy họ vừa là thầy cúng vừa là người chữa bệnh. Gió đen khiến phép thuật của họ mất ổn định, tạo ra các trận đánh thiên về hiệu ứng ngẫu nhiên.","gameplay":"Gây hiệu ứng hoặc sát thương kéo dài; khuyến khích tăng Công để kết thúc nhanh hoặc Phòng Thủ để giảm tổn thất.","is_boss":false,"aliases":["Pháp sư hoàng gia","Pháp sư hoàng gia"]},{"id":"mob-1-03","kind":"mob","name":"Ong giáp thảo nguyên","act":1,"region":"Thảo Nguyên Gió Hát","role":"Sinh vật hoang dã","image":"world-atlas-assets/mobs/1/1-03.png","description":"Ong lớn làm tổ trong cối xay bỏ hoang và các hốc đá. Chúng thụ phấn cho hoa cỏ nhưng cực kỳ hung dữ khi gió đen làm tổ bị lệch hướng. Âm thanh vo ve và bóng đen lướt qua cỏ là dấu hiệu trước trận.","gameplay":"Đối thủ chiến đấu tự động thông thường; cung cấp EXP để tăng cấp và chọn nâng cấp HP, Công hoặc Phòng Thủ.","is_boss":false},{"id":"mob-1-04","kind":"mob","name":"Vua Goblin Grug","act":1,"region":"Thảo Nguyên Gió Hát","role":"Boss khu vực","image":"world-atlas-assets/mobs/1/1-04.png","description":"Grug mặc giáp ghép từ chiến lợi phẩm nhưng vẫn giữ biểu tượng cột gió trên vương miện. Hắn có vẻ hiếu chiến, song thực chất đang cố duy trì trật tự cho cộng đồng tị nạn. Grug chiến đấu bằng chùy lớn, mệnh lệnh và khả năng gọi các nhóm Goblin hỗ trợ.","gameplay":"Trận kiểm tra toàn bộ hướng xây dựng đội: HP để sống sót, Công để kết thúc trước khi bị bào mòn và Phòng Thủ để giảm áp lực.","is_boss":true,"aliases":["Vua Goblin Grug","Vua Goblin Grug"]},{"id":"mob-1-05","kind":"mob","name":"Goblin phá đường","act":1,"region":"Thảo Nguyên Gió Hát","role":"Đơn vị phòng thủ","image":"world-atlas-assets/mobs/1/1-05.png","description":"Goblin khỏe, chuyên kéo xe, dựng trại và phá vật cản. Khi chiến đấu, chúng dùng gậy gỗ và cơ thể nặng để chặn tuyến trước. Ngoài chiến đấu, đây là lực lượng lao động chính giúp cộng đồng Goblin tồn tại.","gameplay":"Có sức bền cao; kiểm tra lượng Công tổng hợp và khả năng duy trì đội hình trong trận kéo dài.","is_boss":false,"aliases":["Cận vệ Goblin","Cận vệ Goblin"]},{"id":"mob-1-06","kind":"mob","name":"Đại bàng gió","act":1,"region":"Thảo Nguyên Gió Hát","role":"Sinh vật hoang dã","image":"world-atlas-assets/mobs/1/1-06.png","description":"Chim săn mồi làm tổ trên các cột đá cao, thường đi theo đoàn thú và ăn xác còn lại. Gió đen khiến chúng nhầm xe hàng là mối đe dọa. Lông đại bàng được người thảo nguyên dùng để dự báo hướng gió nhưng việc săn chúng bị hạn chế.","gameplay":"Đối thủ chiến đấu tự động thông thường; cung cấp EXP để tăng cấp và chọn nâng cấp HP, Công hoặc Phòng Thủ.","is_boss":false},{"id":"mob-2-01","kind":"mob","name":"Sói Pha Lê","act":2,"region":"Hẻm Núi Pha Lê","role":"Thú săn mồi","image":"world-atlas-assets/mobs/2/2-01.png","description":"Sói sống gần các mạch tinh thể, lông và móng dần kết tinh sau nhiều thế hệ. Chúng hấp thụ ánh sáng để định hướng trong hang và bảo vệ lãnh thổ mạnh hơn sói thường. Khi tà khí lan tới, các tinh thể trên lưng phát sáng bất thường và làm chúng đau đớn.","gameplay":"Đối thủ chiến đấu tự động thông thường; cung cấp EXP để tăng cấp và chọn nâng cấp HP, Công hoặc Phòng Thủ.","is_boss":false,"aliases":["Sói Pha Lê Đầu Đàn","Sói Pha Lê Đầu Đàn"]},{"id":"mob-2-02","kind":"mob","name":"Dơi Pha Lê","act":2,"region":"Hẻm Núi Pha Lê","role":"Sinh vật hang động","image":"world-atlas-assets/mobs/2/2-02.png","description":"Dơi ăn côn trùng sống trong hang, cánh mỏng có tinh thể giúp khuếch đại tiếng vang. Chúng thường báo trước khu vực sắp sập bằng việc bay ra hàng loạt. Khi bị kích động, âm thanh của cả đàn có thể làm choáng tổ đội.","gameplay":"Đối thủ chiến đấu tự động thông thường; cung cấp EXP để tăng cấp và chọn nâng cấp HP, Công hoặc Phòng Thủ.","is_boss":false,"aliases":["Tinh thể sống","Tinh thể sống"]},{"id":"mob-2-03","kind":"mob","name":"Nhện đá mỏ sâu","act":2,"region":"Hẻm Núi Pha Lê","role":"Sinh vật hang động","image":"world-atlas-assets/mobs/2/2-03.png","description":"Nhện dùng đá vụn và khoáng chất phủ lên lưng để ngụy trang. Chúng làm tổ tại đường hầm bị bỏ hoang, ăn chuột mỏ và côn trùng. Tơ nhện giữ đất đá khá tốt, vì vậy tiêu diệt toàn bộ tổ có thể khiến hầm mất ổn định.","gameplay":"Đối thủ chiến đấu tự động thông thường; cung cấp EXP để tăng cấp và chọn nâng cấp HP, Công hoặc Phòng Thủ.","is_boss":false},{"id":"mob-2-04","kind":"mob","name":"Thợ mỏ tha hóa","act":2,"region":"Hẻm Núi Pha Lê","role":"Đơn vị tha hóa","image":"world-atlas-assets/mobs/2/2-04.png","description":"Những thợ mỏ bị mắc kẹt và ràng buộc với mệnh lệnh cuối cùng của khu mỏ. Họ vẫn mang cuốc, đèn và trang phục lao động, liên tục lặp lại ca làm việc dù không còn nhận thức đầy đủ. Họ là bằng chứng sống về việc Peace ưu tiên tài nguyên hơn con người.","gameplay":"Có sức bền cao; kiểm tra lượng Công tổng hợp và khả năng duy trì đội hình trong trận kéo dài.","is_boss":false,"aliases":["Giám Công Tha Hóa","Giám Công Tha Hóa"]},{"id":"mob-2-05","kind":"mob","name":"Titan Golem Khổng Lồ","act":2,"region":"Hẻm Núi Pha Lê","role":"Boss khu vực","image":"world-atlas-assets/mobs/2/2-05.png","description":"Cỗ máy cổ bằng đá và pha lê, được tạo ra để bảo vệ kho lưu trữ Hiệp Ước. Titan không độc ác; nó chỉ phân loại mọi kẻ không có quyền truy cập là mối đe dọa. Các mạch sáng trên thân thể hiện trạng thái và giúp người chơi nhận biết giai đoạn chiến đấu.","gameplay":"Trận kiểm tra toàn bộ hướng xây dựng đội: HP để sống sót, Công để kết thúc trước khi bị bào mòn và Phòng Thủ để giảm áp lực.","is_boss":true,"aliases":["Titan Golem Khổng Lồ","Titan Golem Khổng Lồ"]},{"id":"mob-3-01","kind":"mob","name":"Cua hải tặc","act":3,"region":"Bờ Biển San Hô","role":"Đơn vị cận chiến","image":"world-atlas-assets/mobs/3/3-01.png","description":"Cua thông minh thu gom đồ từ xác tàu và đeo chúng như trang bị. Chúng sống thành bầy quanh bãi đá, bảo vệ kho vật sáng và tấn công bất kỳ ai mang biểu tượng hạm đội Peace. Hình dáng vui nhộn che giấu khả năng phối hợp rất tốt.","gameplay":"Đối thủ chiến đấu tự động thông thường; cung cấp EXP để tăng cấp và chọn nâng cấp HP, Công hoặc Phòng Thủ.","is_boss":false,"aliases":["Cua Vua Vỏ Đá","Cua Vua Vỏ Đá"]},{"id":"mob-3-02","kind":"mob","name":"Cá mập chột mắt","act":3,"region":"Bờ Biển San Hô","role":"Thú săn mồi","image":"world-atlas-assets/mobs/3/3-02.png","description":"Cá mập lớn từng bị thương bởi thiết bị khai thác nên đặc biệt hung dữ với tàu. Nó tuần tra vùng biển sâu và thường chỉ xuất hiện khi có máu hoặc tiếng máy khoan. Vết sẹo và mắt che giúp kể lại tác động của con người lên vùng biển.","gameplay":"Đối thủ chiến đấu tự động thông thường; cung cấp EXP để tăng cấp và chọn nâng cấp HP, Công hoặc Phòng Thủ.","is_boss":false,"aliases":["Cá Mập Chột Mắt Khổng Lồ","Cá Mập Chột Mắt Khổng Lồ"]},{"id":"mob-3-03","kind":"mob","name":"Bạch tuộc nhỏ","act":3,"region":"Bờ Biển San Hô","role":"Sinh vật rạn san hô","image":"world-atlas-assets/mobs/3/3-03.png","description":"Sinh vật tò mò sống trong rạn, thường lấy đồ vật nhỏ để trang trí nơi ở. Khi Karkos bị kích động, chúng tập trung quanh tàu và phun mực làm rối đội hình. Ngoài chiến đấu, người chơi có thể đổi đồ sáng lấy vật phẩm chúng nhặt được.","gameplay":"Đối thủ chiến đấu tự động thông thường; cung cấp EXP để tăng cấp và chọn nâng cấp HP, Công hoặc Phòng Thủ.","is_boss":false,"aliases":["Sinh vật biển bị kích động","Sinh vật biển bị kích động"]},{"id":"mob-3-04","kind":"mob","name":"Sứa điện","act":3,"region":"Bờ Biển San Hô","role":"Sinh vật nguyên tố","image":"world-atlas-assets/mobs/3/3-04.png","description":"Sứa phát điện di chuyển theo dòng nước và giúp cung cấp năng lượng tự nhiên cho nhiều sinh vật biển. Thiết bị khai thác làm dòng chảy thay đổi, khiến đàn sứa trôi vào tuyến tàu. Ánh sáng xanh vàng báo trước đòn điện diện rộng.","gameplay":"Gây hiệu ứng hoặc sát thương kéo dài; khuyến khích tăng Công để kết thúc nhanh hoặc Phòng Thủ để giảm tổn thất.","is_boss":false,"aliases":["Sứa Điện Nữ Vương","Sứa Điện Nữ Vương"]},{"id":"mob-3-05","kind":"mob","name":"Đại Thủy Quái Karkos","act":3,"region":"Bờ Biển San Hô","role":"Boss khu vực","image":"world-atlas-assets/mobs/3/3-05.png","description":"Karkos là sinh vật cổ đại bảo vệ đền chìm và rạn san hô. Nó trang trí cơ thể bằng san hô, vỏ sò và di vật của ngôi đền. Karkos tấn công tàu không vì đói mà vì hạm đội Peace đã liên tục phá nơi nó bảo vệ.","gameplay":"Trận kiểm tra toàn bộ hướng xây dựng đội: HP để sống sót, Công để kết thúc trước khi bị bào mòn và Phòng Thủ để giảm áp lực.","is_boss":true,"aliases":["Đại Thủy Quái Bạch Tuộc Karkos","Đại Thủy Quái Karkos"]},{"id":"mob-4-01","kind":"mob","name":"Đại bàng Chạng Vạng","act":4,"region":"Rừng Thông Chạng Vạng","role":"Sinh vật tầng cao","image":"world-atlas-assets/mobs/4/4-01.png","description":"Chim săn mồi làm tổ trên tầng cây cao và giúp rừng phát hiện đám cháy, sinh vật lạ. Khi tà khí lan rộng, chúng trở nên bảo vệ lãnh thổ quá mức. Tiếng cánh và lá rơi từ trên cao là dấu hiệu cảnh báo.","gameplay":"Tạo áp lực sớm lên đội hình; Phòng Thủ và HP giúp tổ đội ổn định trước khi tự động phản công.","is_boss":false},{"id":"mob-4-02","kind":"mob","name":"Báo đen nhiễm tà","act":4,"region":"Rừng Thông Chạng Vạng","role":"Thú săn mồi","image":"world-atlas-assets/mobs/4/4-02.png","description":"Loài săn mồi giữ cân bằng số lượng thú ăn cỏ, có khả năng di chuyển gần như không gây tiếng động. Các đốm đen lan rộng và mắt phát sáng cho thấy nó đang chịu ảnh hưởng của tà khí. Thay vì bị tiêu diệt hoàn toàn, một số sự kiện cho phép người chơi thanh tẩy và thả nó về rừng.","gameplay":"Đối thủ chiến đấu tự động thông thường; cung cấp EXP để tăng cấp và chọn nâng cấp HP, Công hoặc Phòng Thủ.","is_boss":false,"aliases":["Gấu Rừng Tha Hóa","Gấu Rừng Tha Hóa"]},{"id":"mob-4-03","kind":"mob","name":"Nấm độc cuồng nộ","act":4,"region":"Rừng Thông Chạng Vạng","role":"Sinh vật phân hủy","image":"world-atlas-assets/mobs/4/4-03.png","description":"Nấm vốn phân hủy cây chết và tạo đất mới, nhưng hấp thụ tà khí quá mức sẽ di chuyển và phun bào tử độc. Chúng chứng minh bóng tối vẫn có vai trò trong hệ sinh thái, chỉ trở thành nguy hiểm khi mất cân bằng.","gameplay":"Đối thủ chiến đấu tự động thông thường; cung cấp EXP để tăng cấp và chọn nâng cấp HP, Công hoặc Phòng Thủ.","is_boss":false,"aliases":["Tinh linh bóng tối","Tinh linh bóng tối"]},{"id":"mob-4-04","kind":"mob","name":"Tê giác gác rừng","act":4,"region":"Rừng Thông Chạng Vạng","role":"Hộ vệ bản địa","image":"world-atlas-assets/mobs/4/4-04.png","description":"Sinh vật ăn cỏ lớn dùng sừng dọn cây đổ và mở lối cho thú nhỏ. Lớp giáp thô và rìu gỗ cho cảm giác như một chiến binh, nhưng bản chất nó chỉ bảo vệ vùng sinh sản. Tà khí khiến nó nhầm mọi người đi qua là kẻ phá rừng.","gameplay":"Có sức bền cao; kiểm tra lượng Công tổng hợp và khả năng duy trì đội hình trong trận kéo dài.","is_boss":false,"aliases":["Hươu ma pháp nhiễm tà","Hươu ma pháp nhiễm tà"]},{"id":"mob-4-05","kind":"mob","name":"Hộ vệ Cây Nguồn","act":4,"region":"Rừng Thông Chạng Vạng","role":"Hộ vệ tinh nhuệ","image":"world-atlas-assets/mobs/4/4-05.png","description":"Thực thể hình thành từ gỗ, rễ và ý chí của khu rừng. Hộ vệ thức tỉnh khi Cây Nguồn gặp nguy hiểm, điều khiển rễ và triệu hồi mầm cây. Khi nhiễm tà, nó vẫn cố bảo vệ rừng nhưng không còn phân biệt được đồng minh.","gameplay":"Có sức bền cao; kiểm tra lượng Công tổng hợp và khả năng duy trì đội hình trong trận kéo dài.","is_boss":false,"aliases":["Hộ Vệ Cây Nguồn Tha Hóa","Hộ Vệ Cây Nguồn Tha Hóa"]},{"id":"mob-4-06","kind":"mob","name":"Hắc Long Ignis","act":4,"region":"Rừng Thông Chạng Vạng","role":"Boss khu vực","image":"world-atlas-assets/mobs/4/4-06.png","description":"Ignis là sinh vật bảo vệ con đường tới lâu đài và đã tự hấp thụ tà khí nhiều năm để ngăn rừng bị hủy hoại. Vảy của nó cháy bằng hắc hỏa, nhưng giữa các khe vảy vẫn có ánh sáng đỏ cam của sinh mệnh. Ignis là Boss cần được cứu khỏi mất kiểm soát, không phải nguồn gốc căn bệnh.","gameplay":"Trận kiểm tra toàn bộ hướng xây dựng đội: HP để sống sót, Công để kết thúc trước khi bị bào mòn và Phòng Thủ để giảm áp lực.","is_boss":true,"aliases":["Hắc Long Bóng Đêm Ignis","Hắc Long Ignis"]},{"id":"mob-5-01","kind":"mob","name":"Quỷ nhỏ cận chiến","act":5,"region":"Lâu Đài Ma Vương","role":"Đơn vị cận chiến","image":"world-atlas-assets/mobs/5/5-01.png","description":"Quỷ trẻ được giao nhiệm vụ tuần tra, dùng đinh ba nhỏ và cố tỏ ra đáng sợ. Chúng thường làm theo lệnh vì chưa từng biết cách sống khác. Một số sự kiện có thể khiến chúng bỏ vũ khí nếu được bảo đảm không bị tiêu diệt.","gameplay":"Đối thủ chiến đấu tự động thông thường; cung cấp EXP để tăng cấp và chọn nâng cấp HP, Công hoặc Phòng Thủ.","is_boss":false,"aliases":["Quỷ tinh nhuệ","Quỷ tinh nhuệ"]},{"id":"mob-5-02","kind":"mob","name":"Quỷ cung thủ","act":5,"region":"Lâu Đài Ma Vương","role":"Đơn vị tầm xa","image":"world-atlas-assets/mobs/5/5-02.png","description":"Lực lượng canh gác các hàn       const availability = side.availability || {};
      return '<article class="quest-card"><div class="quest-head"><div><span>Nhiệm vụ phụ</span><h2>' + esc(side.title) + '</h2></div>' +
        '<b class="quest-giver">Nguồn sự kiện: ' + entityLink(side.giver) + '</b></div><p class="quest-summary">' + esc(side.summary) + '</p>' +
        '<div class="availability"><strong>Thời điểm:</strong> ' + esc(availability.unlock_text || "") + '<br>' + esc(availability.expires_text || "") + '</div>' +
        '<div class="objective-list">' + (side.objectives || []).map(objectiveHtml).join("") + '</div>' +
        '<div class="payoff"><strong>Ý nghĩa với truyện:</strong> ' + esc(side.narrative_payoff) + '</div>' +
        '<h3 class="mini-title">Điều kiện hoàn thành</h3>' + list(side.completion_conditions, "condition-list") +
        '<h3 class="mini-title">Phần thưởng</h3>' + list(rewardItems(side.rewards), "reward-list") + '</article>';
    }
    function renderQuest() {
      const q = selectedStage.quest;
      if (!q) { main.innerHTML = '<div class="empty">Chưa có dữ liệu nhiệm vụ cho màn này.</div>'; return; }
      const mq = q.main_quest;
      const run = q.integration || {};
      const milestones = (run.main_milestone_days || []).map((day, index) => '<span class="chip ' + (index === 3 ? 'accent' : '') + '">' + (index === 3 ? 'Boss' : 'Mốc truyện ' + (index + 1)) + ': Ngày ' + day + '</span>').join("");
      main.innerHTML = '<div class="view">' + stageHero("Hệ thống nhiệm vụ · nội dung riêng", q.story_summary) +
        '<div class="grid-2"><article class="card"><h2>Vòng chơi của màn</h2><p><strong>' + esc(run.format || "Phiêu lưu theo ngày") + '.</strong> Sống sót, chọn sự kiện, nhận nâng cấp và tiến tới boss cuối ngày.</p><div class="chips" style="margin-top:12px">' + milestones + '</div></article>' +
        '<article class="card"><h2>Nhịp nội dung đề xuất</h2><p>' + esc(run.recommended_auto_battles || 0) + ' trận thường · ' + esc(run.recommended_elite_battles || 0) + ' trận tinh anh · ' + esc(run.recommended_random_events || 0) + ' sự kiện ngẫu nhiên · 2 chuỗi nhiệm vụ phụ.</p></article></div>' +
        '<div class="section-head"><div><span>Triển khai theo lối chơi phiêu lưu tự động</span><h2>Nhiệm vụ của màn hiện tại</h2><p>Mọi yêu cầu đều diễn ra trong tuyến ngày; không cần điều khiển nhân vật đi tìm NPC hay quay về giao nhiệm vụ.</p></div>' +
        '<button class="soft-btn" onclick="go(\'story\')">Xem tuyến truyện của màn này</button></div>' +
        '<div class="quest-layout"><article class="quest-card main-quest"><div class="quest-head"><div><span>Nhiệm vụ chính</span><h2>' + esc(mq.title) + '</h2></div>' +
        '<b class="quest-giver">Mở đầu bởi: ' + entityLink(mq.giver) + '</b></div><p class="quest-summary">' + esc(mq.summary) + '</p>' +
        '<div class="objective-list">' + mq.objectives.map(objectiveHtml).join("") + '</div>' +
        '<h3 class="mini-title">Điều kiện vượt màn</h3>' + list(mq.completion_conditions, "condition-list") +
        '<h3 class="mini-title">Phần thưởng</h3>' + list(rewardItems(mq.rewards), "reward-list") + '</article>' +
        '<div class="side-stack">' + q.side_quests.map(sideQuestHtml).join("") + '</div></div></div>';
    }
    function initials(name) {
      return name.split(/\s+/).slice(0,2).map(x => x[0]).join("").toUpperCase();
    }
    function entityStages(entity) {
      if (entity.kind === "character") return entity.appearances || [];
      return stages.filter(stage => [...stage.enemies, stage.boss].some(name => ENTITY_ALIASES[name] === entity.id))
        .map(stage => ({id:stage.id,title:stage.title,act:stage.act,stage:stage.stage}));
    }
    function entityCard(entity) {
      const appearances = entityStages(entity);
      const visual = entity.image
        ? '<img loading="lazy" src="' + esc(entity.image) + '" alt="' + esc(entity.name) + '">'
        : '<div class="entity-initials">' + esc(initials(entity.name)) + '</div>';
      const details = entity.kind === "character"
        ? '<p><strong>Vai trò trong gameplay:</strong> ' + esc(entity.gameplay) + '</p><p><strong>Hướng phát triển:</strong> ' + esc(entity.growth) + '</p>' +
          '<p><strong>Tuyến truyện:</strong> ' + esc(entity.story) + '</p><p><strong>Giọng thoại:</strong> ' + esc(entity.voice) + '</p>'
        : '<p><strong>Mô tả:</strong> ' + esc(entity.description) + '</p><p><strong>Quan hệ với gameplay chính:</strong> ' + esc(entity.gameplay) + '</p>';
      return '<article class="entity-card ' + (entity.id === selectedEntityId ? 'focused' : '') + '" id="entity-' + esc(entity.id) + '">' +
        '<div class="entity-visual">' + visual + '</div><div class="entity-body"><span class="eyebrow">' + (entity.kind === "character" ? "Hồ sơ nhân vật" : "Bestiary · Hồi " + entity.act) + '</span>' +
        '<h2>' + esc(entity.name) + '</h2><div class="chips"><span class="chip accent">' + esc(entity.title || entity.role) + '</span>' +
        '<span class="chip">' + esc(entity.unlock || entity.region) + '</span></div>' + details +
        (appearances.length ? '<h3 class="mini-title">Xuất hiện trong tuyến truyện</h3><div class="appearance-list">' + appearances.map(a => '<button onclick="go(\'story\',\'' + a.id + '\')">H' + a.act + '-M' + String(a.stage).padStart(2,"0") + ' · ' + esc(a.title) + '</button>').join("") + '</div>' : '') +
        '</div></article>';
    }
    function renderCodex() {
      const visible = ENTITIES.filter(entity => {
        if (entity.id === selectedEntityId) return true;
        if (libraryKind === "characters") return entity.kind === "character";
        if (libraryKind === "mobs") return entity.kind === "mob";
        if (libraryKind === "region") return entity.kind === "mob" && entity.act === selectedStage.act;
        return true;
      });
      main.innerHTML = '<div class="view"><section class="stage-hero"><span class="eyebrow">Thư viện liên kết toàn dự án</span><h1>Nhân vật &amp; Quái vật</h1>' +
        '<p class="lead">Tên được tô màu trong Story và Quest có thể bấm để mở đúng hồ sơ. Mô tả gameplay tuân theo chiến đấu tự động và ba chỉ số tổng hợp HP, Công, Phòng Thủ.</p>' +
        '<div class="hero-meta"><span class="chip accent">' + ENTITIES.filter(x=>x.kind==="character").length + ' nhân vật</span><span class="chip">' + ENTITIES.filter(x=>x.kind==="mob").length + ' hồ sơ quái</span><span class="chip">32 quái có ảnh Atlas</span></div></section>' +
        '<div class="library-tools"><div class="library-tabs"><button class="soft-btn" onclick="libraryKind=\'all\';renderCodex()">Tất cả</button>' +
        '<button class="soft-btn" onclick="libraryKind=\'characters\';renderCodex()">Nhân vật</button><button class="soft-btn" onclick="libraryKind=\'mobs\';renderCodex()">Quái vật</button>' +
        '<button class="soft-btn" onclick="libraryKind=\'region\';renderCodex()">Quái Hồi ' + selectedStage.act + '</button></div><span class="chip">' + visible.length + ' hồ sơ đang hiển thị</span></div>' +
        '<div class="library-grid">' + visible.map(entityCard).join("") + '</div></div>';
      if (selectedEntityId) setTimeout(() => document.getElementById("entity-" + selectedEntityId)?.scrollIntoView({behavior:"smooth",block:"start"}), 0);
    }
    function render() {
      renderSidebar();
      if (mode === "map") renderMap();
      else if (mode === "story") renderStory();
      else if (mode === "quest") renderQuest();
      else renderCodex();
      if (!(mode === "codex" && selectedEntityId)) window.scrollTo({ top: 0, behavior: "instant" });
    }
    document.querySelectorAll(".mode-btn").forEach(btn => btn.onclick = () => go(btn.dataset.mode));
    window.addEventListener("hashchange", route);
    if (!location.hash) go("map", stages[0].id); else route();
  </script>
</body>
</html>
